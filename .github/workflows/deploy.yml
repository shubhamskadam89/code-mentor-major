name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # Navigate to project directory (clones it if not already present)
            if [ ! -d "~/code-mentor-major" ]; then
              git clone https://github.com/shubhamskadam89/code-mentor-major.git ~/code-mentor-major
            fi
            cd ~/code-mentor-major
            
            # Fetch and reset to origin/main
            git fetch origin main
            git reset --hard origin/main
            
            # Navigate to backend and build docker image
            cd backend
            docker build -t major-backend .
            
            # Stop and remove existing container if running
            docker stop major-backend || true
            docker rm major-backend || true
            
            # Run the new container using the local .env configuration file on the EC2 instance
            docker run -d \
              --name major-backend \
              -p 8080:8080 \
              --restart unless-stopped \
              --env-file .env \
              major-backend
