name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # Define target dir
            TARGET_DIR="$HOME/code-mentor-major"
            
            # Check if it's a valid git repo. If not, clean it up but preserve any .env file!
            if [ ! -d "$TARGET_DIR/.git" ]; then
              echo "Directory does not exist or is not a git repo. Setting it up..."
              if [ -f "$TARGET_DIR/backend/.env" ]; then
                echo "Preserving existing .env file..."
                cp "$TARGET_DIR/backend/.env" /tmp/backend_env_backup
              fi
              rm -rf "$TARGET_DIR"
              git clone https://github.com/shubhamskadam89/code-mentor-major.git "$TARGET_DIR"
              if [ -f /tmp/backend_env_backup ]; then
                mkdir -p "$TARGET_DIR/backend"
                mv /tmp/backend_env_backup "$TARGET_DIR/backend/.env"
              fi
            fi
            
            cd "$TARGET_DIR"
            
            # Fetch and reset to main
            git fetch origin main
            git reset --hard origin/main
            
            # Navigate to backend and build docker image
            cd backend
            docker build -t major-backend .
            
            # Stop and remove existing container if running
            docker stop major-backend || true
            docker rm major-backend || true
            
            # Run the new container using the local .env configuration file on the EC2 instance
            docker run -d \
              --name major-backend \
              -p 8080:8080 \
              --restart unless-stopped \
              --env-file .env \
              major-backend
