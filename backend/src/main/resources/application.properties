spring.application.name=aiassist

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/codementor
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


ai.mode=LLM
gemini.api.key=${GEMINI_API_KEY:none}

# Ollama / AI Provider Configuration
ai.ollama.url=http://localhost:11434/api/generate
ai.ollama.model=nemotron-3-super:cloud

# JWT Configuration
jwt.secret=CodeMentorSecretKeyForJWTSigning2024CollegeEditionSecure
jwt.expiration=86400000

# OAuth2 (Google) Configuration
# Replace these defaults with env vars in production.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:1020250980724-hqp7ne5p8g0ng2t9htgpbok6lq6vfveu.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET: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}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Where the frontend receives token query params after OAuth2 login success.
frontend.url=http://localhost:3000
app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:3000/#/auth/callback}

