spring.application.name=aiassist

# Database Configuration (AWS Aurora PostgreSQL in deployment)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.sql.init.mode=never


ai.mode=${AI_MODE:LLM}
ai.provider=${AI_PROVIDER:gemini}
gemini.api.key=${GEMINI_API_KEY:none}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash}

groq.api.key=${GROQ_API_KEY:none}
groq.model=${GROQ_MODEL:llama-3.3-70b-specdec}

# Ollama / AI Provider Configuration
ai.ollama.url=${AI_OLLAMA_URL:}
ai.ollama.model=${AI_OLLAMA_MODEL:nemotron-3-super:cloud}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# OAuth2 (Google) Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Where the frontend receives token query params after OAuth2 login success.
frontend.url=${FRONTEND_URL}
app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:${FRONTEND_URL}/#/auth/callback}

# Comma-separated origins/patterns allowed to call the API.
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:${FRONTEND_URL}}
app.cookie.secure=${COOKIE_SECURE:true}

# Rate limiting configuration
app.rate-limit.enabled=${APP_RATE_LIMIT_ENABLED:true}
app.rate-limit.cooldown-seconds=${APP_RATE_LIMIT_COOLDOWN_SECONDS:120}

# Logging configuration (Store logs in different folder: logs/aiassist.log)
logging.level.com.example.aiassist=INFO
logging.file.name=logs/aiassist.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Proxy / Nginx header forwarding strategy
server.forward-headers-strategy=framework

